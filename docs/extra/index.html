<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Module hierarchy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Module hierarchy</h1>
  <p>Nested boxes = instances. Each box lists its ports as <code>port = signal-in-parent</code>.
     <b>Click any signal</b> to highlight every place that wire appears and see its path below.
     Click a box title to collapse it.</p>
  <div class="legend">
    <span class="chip in">input</span><span class="chip out">output</span><span class="chip wire">wire declared here</span>
    <button id="expand">Expand all</button><button id="collapse">Collapse leaves</button>
  </div>
</header>
<main id="root"></main>
<aside id="panel"><b>Net trace</b><div id="trace">Click a signal.</div></aside>
<script src="hierarchy.js"></script>
</body>
</html>
